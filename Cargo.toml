[package]
name = "autotyper"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Types text for you where paste is blocked: RDP lock screens, VM consoles, remote sessions."
license = "MIT"
repository = "https://github.com/viru185/AutoTyper"
readme = "README.md"
keywords = ["autotype", "keyboard", "rdp", "typing", "clipboard"]
categories = ["command-line-utilities", "gui"]
publish = false

[features]
default = ["tray"]
# Opt-in background mode: tray icon + global hotkey (`autotyper --background`).
tray = ["dep:tray-icon", "dep:global-hotkey", "dep:winit"]

[dependencies]
arboard = { version = "3.7.0", default-features = false }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
interprocess = { version = "2.4.10", default-features = false }
lexopt = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.2.3", default-features = false, features = ["parse", "serde", "std", "display"] }
zeroize = "1.9.2"
global-hotkey = { version = "0.10.0", optional = true }
winit = { version = "0.30.13", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
mslnk = "0.1.8"
self-replace = "1.5.1"
tray-icon = { version = "0.27.0", default-features = false, optional = true }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
enigo = { version = "0.6.1", default-features = false }
tray-icon = { version = "0.27.0", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["x11", "wayland"] }
enigo = { version = "0.6.1", default-features = false, features = ["x11rb"] }
tray-icon = { version = "0.27.0", default-features = false, features = ["ksni"], optional = true }

[build-dependencies]
ico = "0.6.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

# Keep debug builds of the GUI responsive.
[profile.dev.package."*"]
opt-level = 2
